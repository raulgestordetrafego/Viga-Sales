services:
  postgres-agente:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=agente
      - POSTGRES_USER=agente
      - POSTGRES_PASSWORD=${POSTGRES_AGENTE_PASSWORD}
    volumes:
      - postgres-agente-data:/var/lib/postgresql/data
      - ./01 - DB/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - viga_db

  # ── Postgres CRM ──────────────────────────────────────────────────────────
  postgres-crm:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=vigasales
      - POSTGRES_USER=vigasales
      - POSTGRES_PASSWORD=${POSTGRES_CRM_PASSWORD}
    volumes:
      - postgres-crm-data:/var/lib/postgresql/data
      - ./01 - DB/postgres-crm-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - viga_db

  # ── Postgres Leads ────────────────────────────────────────────────────────
  postgres-leads:
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_DB=vigasales_leads
      - POSTGRES_USER=vigasales_leads
      - POSTGRES_PASSWORD=${POSTGRES_LEADS_PASSWORD}
    volumes:
      - postgres-leads-data:/var/lib/postgresql/data
      - ./01 - DB/postgres-leads-init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - viga_db

  # ── Container 1: Viga Sales CRM ──────────────────────────────────────────────
  viga-sales:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default

      - traefik.http.routers.vigasales.rule=Host(`vigasales.shop`) || Host(`www.vigasales.shop`) || Host(`equipe.vigasales.shop`) || Host(`blog.vigasales.com.br`) || Host(`proposta124.vigasales.com.br`) || Host(`proposta125.vigasales.com.br`) || Host(`proposta126.vigasales.com.br`) || Host(`sites.vigasales.com.br`)
      - traefik.http.routers.vigasales.tls=true
      - traefik.http.routers.vigasales.entrypoints=web,websecure
      - traefik.http.routers.vigasales.tls.certresolver=mytlschallenge
      - traefik.http.services.vigasales.loadbalancer.server.port=3000
    environment:
      - TZ=America/Sao_Paulo
      - NODE_ENV=production
      - PORT=3000
      - EVOLUTION_API_URL=${EVOLUTION_API_URL}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY}
      - EVOLUTION_INSTANCE=${EVOLUTION_INSTANCE}
      - FORWARD_WEBHOOK_URL=${FORWARD_WEBHOOK_URL}
      - APP_URL=${APP_URL}
      - N8N_AUTH_TOKEN=${N8N_AUTH_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY}
      - ELEVENLABS_VOICE_ID=${ELEVENLABS_VOICE_ID}
      - ELEVENLABS_MODEL_ID=${ELEVENLABS_MODEL_ID:-eleven_flash_v2_5}
      - ELEVENLABS_ENABLED=${ELEVENLABS_ENABLED:-true}
      - ELEVENLABS_DAILY_CHAR_LIMIT=${ELEVENLABS_DAILY_CHAR_LIMIT:-0}
      - ELEVENLABS_MONTHLY_CHAR_LIMIT=${ELEVENLABS_MONTHLY_CHAR_LIMIT:-0}
      - ELEVENLABS_MAX_CHARS_PER_MESSAGE=${ELEVENLABS_MAX_CHARS_PER_MESSAGE:-600}
      - SENDER_NAME=${SENDER_NAME:-Raul}
      - SENDER_COMPANY=${SENDER_COMPANY:-Viga Sales}
      - VIGA_INTERNAL_TOKEN=${VIGA_INTERNAL_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - N8N_AUTH_TOKEN=${N8N_AUTH_TOKEN}
      - N8N_LEAD_WEBHOOK_URL=${N8N_LEAD_WEBHOOK_URL}
      - N8N_AGENT_URL=${N8N_AGENT_URL}
      - EVOLUTION_AGENT_ALLOW=${EVOLUTION_AGENT_ALLOW}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - IMAP_HOST=${IMAP_HOST}
      - IMAP_PORT=${IMAP_PORT}
      - IMAP_USER=${IMAP_USER}
      - IMAP_PASSWORD=${IMAP_PASSWORD}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_VERIFY_TOKEN=${META_VERIFY_TOKEN}
      - BOSS_PHONES=${BOSS_PHONES}
      - GROUP_COMANDO_ID=${GROUP_COMANDO_ID}
      - GROUP_OPERACOES_ID=${GROUP_OPERACOES_ID}
      - GROUP_CONTEUDO_ID=${GROUP_CONTEUDO_ID}
      - GTM_CONTAINER_ID=${GTM_CONTAINER_ID}
      - CHIEF_MODEL=${CHIEF_MODEL:-deepseek-chat}
      - CHIEF_WEEKLY_MODEL=${CHIEF_WEEKLY_MODEL:-deepseek-chat}
      - USD_TO_BRL=${USD_TO_BRL:-5.5}
      - COST_PER_MSG=${COST_PER_MSG:-0.071}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOSS_IDS=${TELEGRAM_BOSS_IDS}
      - DATABASE_URL=postgresql://vigasales:${POSTGRES_CRM_PASSWORD}@postgres-crm:5432/vigasales?sslmode=disable
      - DATABASE_AGENTE_URL=postgresql://agente:${POSTGRES_AGENTE_PASSWORD}@postgres-agente:5432/agente?sslmode=disable
      - DATABASE_LEADS_URL=postgresql://vigasales_leads:${POSTGRES_LEADS_PASSWORD}@postgres-leads:5432/vigasales_leads?sslmode=disable
    volumes:
      - ./public/audio:/app/public/audio:ro
      - ./public/templates:/app/public/templates
      - ./public/vid:/app/public/vid:ro
    networks:
      - default
      - n8n_traefik
      - viga_db

networks:
  n8n_traefik:
    external: true
    name: n8n_default
  viga_db:
    internal: true

volumes:
  postgres-agente-data:
  postgres-crm-data:
  postgres-leads-data:
