services:
  hub:
    build: .
    restart: always
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.vigahub.rule=Host(`hub.vigasales.shop`)
      - traefik.http.routers.vigahub.entrypoints=web,websecure
      - traefik.http.routers.vigahub.tls=true
      - traefik.http.routers.vigahub.tls.certresolver=mytlschallenge
      - traefik.http.services.vigahub.loadbalancer.server.port=80
    networks:
      - default
      - n8n_traefik

networks:
  n8n_traefik:
    external: true
    name: n8n_default
